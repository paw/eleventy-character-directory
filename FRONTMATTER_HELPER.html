<!DOCTYPE html>
<head>
    <link rel="stylesheet" type="text/css" href="./public/css/global.css" />
    <link rel="stylesheet" type="text/css" href="./public/css/dollhouse.css" />
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v7.3.1/css/all.css" crossorigin="anonymous">
    <style>
        #basic { display: grid; grid-template-columns: 50% 50% }
        #connections, .full { grid-column: 1 / 3; }
        #connections div {
            display: grid; grid-template-columns: 10% 20% 10% 50% 10%;
            align-items: baseline;
        }
        .temp {
            opacity: 0.4 !important;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="content">
        <div id="inputs">
            <div class="card" id="basic">
                <h2 class="content-title full">Basic Info</h2>
                <label for="name">name</label><input type="text" placeholder="Name" name="name">
                <label for="id">id</label><input type="number" step="1" min="0" placeholder="1" name="id">
                <label for="friends">friends</label><input type="text" placeholder="1,2,3" name="friends">
                <label for="enemies">enemies</label><input type="text" placeholder="1,2,3" name="enemies">
            </div>
            
            <div id="connections" class="card">
                <h2 class="content-title">Connections</h2>
                <button name="add connection" style="width: 100%;">Add New Connection <i class="fa-solid fa-plus"></i></button>
                <div class="template temp">character id: <input type="number" step="1" min="0" placeholder="1" name="id"><b>Feelings:</b><textarea></textarea> <button><i class="fa-solid fa-circle-xmark"></i> Remove</button></div>
            </div>
        </div>
        <button id="submit">Generate</button>
        <button id="clear">Clear</button>
        <div class="output">
            <textarea id="output"></textarea>
        </div>
    </div>
</body>
<script type="text/javascript">
    let template = ``;
</script>
</html>
